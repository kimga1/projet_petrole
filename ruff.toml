# Configuration ruff du projet (lint uniquement, pas de reformatage global).
#
#   ruff check src dashboard scripts tests
#
# Règles : pyflakes (code mort), erreurs de syntaxe, ordre des imports.
# E501 (longueur de ligne) volontairement absent : les gabarits HTML du
# dashboard assument quelques lignes longues.

line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
# Convention du repo : stdlib -> tiers -> src (bibliothèque) -> modules
# locaux du dashboard (importés par chemin, cf. sys.path dans app.py).
known-first-party = ["src"]
known-local-folder = ["i18n", "theme", "ui"]
